<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task - 02</title>
</head>
    <style>
        body{
            background-color: lightblue;
            font-family: Arial;
        }
        .login-box{
            width: 300px;
            background: white;
            padding: 20px;
            margin: 100px auto;
            border-radius: 10px;
            text-align: center;
        }
        input{
            width: 90%;
            padding: 10px;
            margin: 10px;
        }
        button{
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }
        h2{
            color: darkblue;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login Form</h2>
        <form>
            <input type="email" placeholder="Enter Email">
            <br>
            <input type="password" placeholder="Enter Password">
            <br>
            <button>Login</button>
        </form>
    </div>
</body>
</html>
